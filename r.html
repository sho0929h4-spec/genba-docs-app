<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://kkglrmogktnhedkcgyid.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a3a5c'/%3E%3Ctext x='32' y='46' font-size='38' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif'%3E現%3C/text%3E%3C/svg%3E">
<title>作業報告書の入力</title>
<!-- ⑧ 協力業者の入力ページ（ログイン不要）。URL の # 以降が合言葉（token）。中身は js/vendor.js が作る -->
<style>
  :root{--navy:#1a3a5c;--navy2:#22507e;--border:#dde5ef;--bg:#f0f4f8;--text:#1e293b;--muted:#64748b;--red:#c0392b;--green:#1e7e34;--amber:#b45309;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  [hidden]{display:none !important;}
  button,input,select,textarea{font-family:inherit;}
  .v-hdr{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;}
  .v-hdr>div{min-width:0;}
  .v-logo{width:40px;height:40px;flex:none;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .v-org{font-size:14px;overflow-wrap:anywhere;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px));}
  .v-full{max-width:520px;margin:12vh auto 0;padding:0 16px;text-align:center;}
  .v-full .v-icon{font-size:40px;margin-bottom:8px;}
  .v-full h1{font-size:18px;margin-bottom:8px;overflow-wrap:anywhere;}
  .v-full p{font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .v-full .btn{margin-top:16px;}
  .btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:12px 16px;min-height:44px;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .btn.green{background:var(--green);}
  .btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:8px;}
  .btn:disabled{opacity:.6;cursor:default;}
  .chip{padding:6px 12px;min-height:36px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13px;color:var(--muted);cursor:pointer;}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;}
  .chip:disabled{opacity:.6;cursor:default;}
  .rep-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;min-width:0;}
  .rep-card h3{font-size:15px;margin-bottom:8px;}
  .rep-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .rep-between>*{min-width:0;}
  .rep-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .rep-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:#fdf3e6;color:var(--amber);}
  .rep-note{font-size:12px;color:var(--muted);background:#f7faff;border:1px dashed #b9cde6;border-radius:10px;padding:9px 11px;margin-bottom:12px;}
  .rep-val:empty{display:none;}
  .rep-val{margin-bottom:12px;display:flex;flex-direction:column;gap:6px;}
  .rep-val-e,.rep-val-w{font-size:13px;font-weight:700;border-radius:10px;padding:9px 12px;overflow-wrap:anywhere;white-space:pre-line;}
  .rep-val-e{background:#fdecea;color:var(--red);border:1px solid #f5c6c0;}
  .rep-val-w{background:#fdf3e6;color:var(--amber);border:1px solid #f3d9b5;}
  .rep-ff{margin-bottom:12px;min-width:0;}
  .rep-ff>label,.rep-lbl-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .rep-ff input,.rep-ff select,.rep-ff textarea{width:100%;min-width:0;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);}
  .rep-ff textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .rep-ff textarea.short{min-height:64px;}
  .rep-hint{display:block;font-size:11px;color:var(--muted);margin:-2px 0 6px;}
  .rep-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px;}
  .rep-auto{background:#f4f7fb;border-radius:10px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin-top:8px;}
  .rep-auto dt{color:var(--muted);font-size:12px;}
  .rep-auto dd{overflow-wrap:anywhere;}
  .rep-time{display:flex;gap:8px;}
  .rep-time input{flex:1;min-width:0;}
  .rep-now{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:0 12px;min-height:44px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .rep-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .rep-chips .chip{text-align:left;max-width:100%;overflow-wrap:anywhere;}
  .rep-group-ttl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;}
  .rep-card h3+.rep-group-ttl{margin-top:0;}
  .rep-free{margin-top:8px;}
  .rep-free input{width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);}
  .rep-lbl-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
  /* Task 20: 押すと☑の行（チェックリスト・原因）・次の対応方針（丸）・固定の作業区分・以前の項目 */
  .rep-checks{display:flex;flex-direction:column;gap:6px;}
  .rep-checks.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .rep-checks.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .rep-check{display:flex;align-items:center;gap:10px;width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:14px;line-height:1.4;text-align:left;cursor:pointer;font-family:inherit;}
  .rep-check-t{min-width:0;overflow-wrap:anywhere;}
  .rep-check-box{flex:0 0 22px;width:22px;height:22px;border:2px solid #9fb2c8;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;line-height:1;}
  .rep-check.radio .rep-check-box{border-radius:50%;}
  .rep-check.on{background:#e6eef8;border-color:var(--navy);color:var(--navy);font-weight:700;}
  .rep-check.on .rep-check-box{background:var(--navy);border-color:var(--navy);}
  .rep-check.on .rep-check-box::after{content:'✓';}
  .rep-check.radio.on .rep-check-box::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;}
  .rep-check:disabled{opacity:.65;cursor:default;}
  .rep-sub-fields{margin-top:8px;padding-left:10px;border-left:3px solid #c9d7e8;}
  .rep-sub-fields .rep-ff-sub{margin-bottom:8px;}
  .rep-fixed{padding:11px 12px;border-radius:10px;background:#f4f7fb;border:1.5px solid var(--border);font-size:15px;font-weight:700;color:var(--navy);}
  .rep-fixed-hint{margin:5px 0 0;}
  .rep-legacy{font-size:12px;color:var(--muted);background:#f7faff;border:1px dashed #b9cde6;border-radius:8px;padding:7px 10px;margin-top:8px;overflow-wrap:anywhere;}
  @media(max-width:400px){ .rep-checks.grid3{grid-template-columns:minmax(0,1fr);} .rep-checks.grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .rep-mic{min-width:44px;min-height:36px;margin-bottom:5px;border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .rep-mic.on{background:#fdecea;border-color:var(--red);color:var(--red);}
  .rep-mic:disabled{opacity:.45;cursor:default;}
  .rep-ph{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--border);padding:10px 0;}
  .rep-ph-img{width:96px;height:72px;border-radius:8px;background:linear-gradient(135deg,#cfdbe9,#e8eef5);object-fit:cover;display:block;}
  .rep-ph-none{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.3;color:#5b7290;padding:4px;}
  .rep-ph-f{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .rep-ph-f input,.rep-ph-f select{padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;background:#fff;color:var(--text);width:100%;min-width:0;}
  .rep-ph-mv{display:flex;flex-direction:column;gap:4px;}
  .rep-ph-mv button{width:40px;min-height:36px;border:1.5px solid var(--border);background:#fff;border-radius:8px;color:var(--navy);font-size:14px;cursor:pointer;}
  .rep-ph-mv button.del{color:var(--red);}
  .rep-ph-mv button:disabled{opacity:.4;cursor:default;}
  .rep-ph-empty{padding:10px 0;border-top:1px solid var(--border);}
  .rep-photo-msg{color:var(--muted);font-size:12px;margin-top:4px;white-space:pre-line;overflow-wrap:anywhere;}
  .rep-photo-msg.err-on{color:var(--red);}
  .v-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;}
  .v-bar .btn{flex:1;max-width:320px;}
  @media(max-width:560px){ .rep-g2{grid-template-columns:minmax(0,1fr);} .rep-ph{grid-template-columns:80px minmax(0,1fr) auto;} .rep-ph-img{width:80px;height:64px;} .rep-card{padding:14px 13px;} }
</style>
</head>
<body>
<header class="v-hdr" id="v-hdr" hidden>
  <div class="v-logo" id="v-logo" aria-hidden="true"></div>
  <div><b class="v-org" id="v-org"></b><div class="rep-sub">作業報告書の入力をお願いします</div></div>
</header>
<main class="wrap" id="v-root"></main>
<div class="v-bar" id="v-bar" hidden>
  <button class="btn green" id="v-submit" type="button">提出する</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
<script src="js/crypto-util.js?v=a733657"></script>
<script src="js/supabase-config.js?v=a733657"></script>
<script src="js/image.js?v=a733657"></script>
<script src="js/report-logic.js?v=a733657"></script>
<script src="js/photo-marks.js?v=a733657"></script>
<script src="js/photo-mark-editor.js?v=a733657"></script>
<script src="js/report-form.js?v=a733657"></script>
<script src="js/vendor.js?v=a733657"></script>
</body>
</html>
