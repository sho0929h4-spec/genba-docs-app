<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/; style-src 'unsafe-inline'; img-src blob: data: https://kkglrmogktnhedkcgyid.supabase.co; connect-src https://kkglrmogktnhedkcgyid.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a3a5c'/%3E%3Ctext x='32' y='46' font-size='38' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif'%3E現%3C/text%3E%3C/svg%3E">
<title>作業報告書の入力</title>
<!-- ⑧ 担当者の入力ページ（URL を渡した人。ログイン不要）。URL の # 以降が合言葉（token）。中身は js/vendor.js が作る -->
<style>
  :root{--navy:#1a3a5c;--navy2:#22507e;--border:#dde5ef;--bg:#f0f4f8;--text:#1e293b;--muted:#64748b;--red:#c0392b;--green:#1e7e34;--amber:#b45309;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  [hidden]{display:none !important;}
  button,input,select,textarea{font-family:inherit;}
  .v-hdr{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;}
  .v-hdr>div{min-width:0;}
  .v-logo{width:40px;height:40px;flex:none;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .v-org{font-size:14px;overflow-wrap:anywhere;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px));}
  .v-full{max-width:520px;margin:12vh auto 0;padding:0 16px;text-align:center;}
  .v-full .v-icon{display:flex;justify-content:center;color:var(--navy);margin-bottom:10px;}
  .v-full h1{font-size:18px;margin-bottom:8px;overflow-wrap:anywhere;}
  .v-full p{font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .v-full .btn{margin-top:16px;}
  /* Task 35: 提出後の再編集（依頼元へ送る前まで）。画面内の確認（confirm は使わない）・小さな札 */
  .v-reedit{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);}
  .v-reedit p{margin-bottom:4px;}
  .v-ask{background:#fff8e6;border:1.5px solid #f5c26b;border-radius:12px;padding:10px 12px;margin-top:12px;text-align:left;}
  .v-ask-t{font-size:13px;white-space:pre-line;overflow-wrap:anywhere;}
  .v-ask-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .v-ask-acts .btn{margin-top:0;min-height:40px;padding:8px 14px;font-size:14px;}
  /* Task 54: 確認のポップアップ（js/ask.js。confirm() の代わり。× と「キャンセル」でだけ閉じる。見た目は社内の画面のシートと同じ） */
  .modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:400;overflow-y:auto;}
  .modal{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;}
  .modal h3{font-size:16px;margin-bottom:14px;}
  .modal-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .modal-x{flex:none;width:40px;height:40px;margin:-10px -8px 0 0;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;font-family:inherit;}
  .modal-x:hover{background:var(--bg);color:var(--text);}
  .modal-act{display:flex;gap:8px;margin-top:6px;}
  .modal-act .btn{flex:1;}
  .btn.red{background:var(--red);color:#fff;}
  .ask-pop-t{white-space:pre-wrap;font-size:14px;line-height:1.6;overflow-wrap:anywhere;margin:0 0 14px;}
  .v-reedit .err{color:var(--red);font-size:13px;margin-top:8px;white-space:pre-wrap;}
  .v-reedit .err:empty{display:none;}
  .reedit-tag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;line-height:1.7;white-space:nowrap;}
  .v-reedit-note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:#f4f7fb;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;overflow-wrap:anywhere;}
  .btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:12px 16px;min-height:44px;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .btn.green{background:var(--green);}
  .btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:8px;}
  .btn:disabled{opacity:.6;cursor:default;}
  .chip{padding:6px 12px;min-height:36px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13px;color:var(--muted);cursor:pointer;}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;}
  .chip:disabled{opacity:.6;cursor:default;}
  .rep-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;min-width:0;}
  .rep-card h3{font-size:15px;margin-bottom:8px;}
  .rep-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .rep-between>*{min-width:0;}
  .rep-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .rep-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:#fdf3e6;color:var(--amber);}
  .rep-note{font-size:12px;color:var(--muted);background:#f7faff;border:1px dashed #b9cde6;border-radius:10px;padding:9px 11px;margin-bottom:12px;}
  .rep-val:empty{display:none;}
  .rep-val{margin-bottom:12px;display:flex;flex-direction:column;gap:6px;}
  .rep-val-e,.rep-val-w{font-size:13px;font-weight:700;border-radius:10px;padding:9px 12px;overflow-wrap:anywhere;white-space:pre-line;}
  .rep-val-e{background:#fdecea;color:var(--red);border:1px solid #f5c6c0;}
  .rep-val-w{background:#fdf3e6;color:var(--amber);border:1px solid #f3d9b5;}
  .rep-ff{margin-bottom:12px;min-width:0;}
  .rep-ff>label,.rep-lbl-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .rep-ff input,.rep-ff select,.rep-ff textarea{width:100%;min-width:0;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);}
  .rep-ff textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .rep-ff textarea.short{min-height:64px;}
  .rep-ff>label.rep-after-reason{margin:10px 0 0;}
  .rep-ff>label.rep-after-reason[hidden]{display:none;}
  /* Task 26: 「原因と判断した理由」は記載例（placeholder）が全部見える高さ（スマホは6行ほど） */
  .rep-ff textarea.rep-reason{min-height:110px;}
  @media(max-width:560px){ .rep-ff textarea.rep-reason{min-height:184px;} }
  .rep-hint{display:block;font-size:11px;color:var(--muted);margin:-2px 0 6px;}
  .rep-next-lock{margin:6px 0 0;font-size:12px;color:var(--navy);font-weight:700;}
  .rep-next-lock[hidden]{display:none;}
  .rep-photo-note{margin:6px 0 2px;padding:8px 10px;border-radius:8px;background:#fff6e0;border:1px solid #f0d48a;color:#6b4a00;font-size:13px;font-weight:700;line-height:1.5;overflow-wrap:anywhere;}
  .rep-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px;}
  /* Task 39: 号室の行（号室・役割・×）＋「＋ 号室を追加」 */
  .rep-rooms{grid-column:1/-1;}
  .rep-room-line{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .rep-ff .rep-room-line input.rep-room-no{flex:1 1 auto;width:auto;}
  .rep-ff .rep-room-line select.rep-room-role{flex:0 0 8.5em;width:8.5em;padding:11px 8px;}
  .rep-room-del{flex:0 0 40px;min-height:44px;border:1.5px solid var(--border);border-radius:10px;background:#f4f7fb;color:var(--muted);font-size:18px;font-family:inherit;cursor:pointer;}
  .rep-room-del-sp{flex:0 0 40px;}
  .rep-room-add{min-height:40px;padding:0 14px;border:1.5px dashed var(--border);border-radius:10px;background:#f4f7fb;color:var(--navy);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
  .rep-room-add[hidden]{display:none;}
  .rep-auto{background:#f4f7fb;border-radius:10px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin-top:8px;}
  .rep-auto dt{color:var(--muted);font-size:12px;}
  .rep-auto dd{overflow-wrap:anywhere;}
  .rep-time{display:flex;gap:8px;}
  .rep-time input{flex:1;min-width:0;}
  .rep-now{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:0 12px;min-height:44px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .rep-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .rep-chips .chip{text-align:left;max-width:100%;overflow-wrap:anywhere;}
  .rep-group-ttl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;}
  .rep-card h3+.rep-group-ttl{margin-top:0;}
  .rep-free{margin-top:8px;}
  .rep-free input{width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);}
  .rep-lbl-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
  /* Task 20: 押すと☑の行（チェックリスト・原因）・次の対応方針（丸）・固定の作業区分・以前の項目 */
  .rep-checks{display:flex;flex-direction:column;gap:6px;}
  .rep-checks.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .rep-checks.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .rep-check{display:flex;align-items:center;gap:10px;width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:14px;line-height:1.4;text-align:left;cursor:pointer;font-family:inherit;}
  .rep-check-t{min-width:0;overflow-wrap:anywhere;}
  .rep-check-box{flex:0 0 22px;width:22px;height:22px;border:2px solid #9fb2c8;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;line-height:1;}
  .rep-check.radio .rep-check-box{border-radius:50%;}
  .rep-check.on{background:#e6eef8;border-color:var(--navy);color:var(--navy);font-weight:700;}
  .rep-check.on .rep-check-box{background:var(--navy);border-color:var(--navy);}
  .rep-check.on .rep-check-box::after{content:'✓';}
  .rep-check.radio.on .rep-check-box::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;}
  .rep-check:disabled{opacity:.65;cursor:default;}
  .rep-sub-fields{margin-top:8px;padding:8px 10px;background:#f4f7fb;border-radius:10px;}
  .rep-sub-fields .rep-ff-sub{margin-bottom:8px;}
  .rep-due-why{background:#fff7ed;border:1px solid #fde3c4;}
  .rep-due-why-head{font-size:13px;font-weight:700;color:#9a3412;margin-bottom:6px;}
  /* Task 21: 鍵の取り扱い・写真の区分（自由記載） */
  .rep-key-box{margin-top:8px;}
  .rep-key-box .rep-checks{margin-bottom:8px;}
  .rep-key-ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .rep-key-ph .btn{min-height:40px;}
  .rep-fixed{padding:11px 12px;border-radius:10px;background:#f4f7fb;border:1.5px solid var(--border);font-size:15px;font-weight:700;color:var(--navy);}
  .rep-fixed-hint{margin:5px 0 0;}
  .rep-legacy{font-size:12px;color:var(--muted);background:#f7faff;border:1px dashed #b9cde6;border-radius:8px;padding:7px 10px;margin-top:8px;overflow-wrap:anywhere;}
  @media(max-width:400px){ .rep-checks.grid3{grid-template-columns:minmax(0,1fr);} .rep-checks.grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .rep-mic{min-width:44px;min-height:36px;margin-bottom:5px;border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .rep-mic.on{background:#fdecea;border-color:var(--red);color:var(--red);}
  .rep-mic:disabled{opacity:.45;cursor:default;}
  .rep-ph{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--border);padding:10px 0;}
  .rep-ph-img{width:96px;height:72px;border-radius:8px;background:linear-gradient(135deg,#cfdbe9,#e8eef5);object-fit:cover;display:block;}
  .rep-ph-none{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.3;color:#5b7290;padding:4px;}
  .rep-ph-f{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .rep-ph-f input,.rep-ph-f select{padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;background:#fff;color:var(--text);width:100%;min-width:0;}
  .rep-ph-mv{display:flex;flex-direction:column;gap:4px;}
  .rep-ph-mv button{width:40px;min-height:36px;border:1.5px solid var(--border);background:#fff;border-radius:8px;color:var(--navy);font-size:14px;cursor:pointer;}
  .rep-ph-mv button.del{color:var(--red);}
  .rep-ph-mv button:disabled{opacity:.4;cursor:default;}
  .rep-ph-empty{padding:10px 0;border-top:1px solid var(--border);}
  .rep-photo-msg{color:var(--muted);font-size:12px;margin-top:4px;white-space:pre-line;overflow-wrap:anywhere;}
  .rep-photo-msg.err-on{color:var(--red);}
  .v-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;}
  .v-bar .btn{flex:1;max-width:320px;}
  @media(max-width:560px){ .rep-g2{grid-template-columns:minmax(0,1fr);} .rep-ph{grid-template-columns:80px minmax(0,1fr) auto;} .rep-ph-img{width:80px;height:64px;} .rep-card{padding:14px 13px;} }
  /* 依頼内容の表示・写真の拡大・到着が遅れそう（Task 28。js/request-view.js。index.html と r.html で同じ） */
  .rq-view{display:grid;gap:8px;min-width:0;font-size:14px;}
  .rq-title{font-size:15px;}
  .rq-row{display:grid;gap:3px;min-width:0;}
  .rq-k{font-size:12px;font-weight:700;color:var(--muted);}
  .rq-mark{display:inline-block;margin-left:2px;padding:2px 8px;border-radius:999px;background:#b42318;color:#fff;font-size:12px;font-weight:800;vertical-align:1px;}
  /* Task 33: 依頼内容の一番上の号室ごとの1行（js/request-view.js visitRows。index.html と r.html で同じ） */
  .rq-visit{display:grid;gap:6px;min-width:0;padding-bottom:10px;border-bottom:1px dashed var(--border);}
  .rq-vrow{display:grid;gap:2px;min-width:0;background:#e6eef8;border-radius:10px;padding:8px 10px;}
  .rq-vrow.extra{background:#f4f7fb;}
  .rq-vhead .rm-tag{vertical-align:2px;}
  .rq-vrow .rm-tag.damage{background:#fff;}
  .rm-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .rm-tag.cause{background:#fdecec;color:#b42318;}
  .rm-tag.damage{background:#e8f0fb;color:#1d4f91;}
  .rm-tag.other{background:#f1f3f5;color:#475467;}
  .rq-vhead{font-size:16px;line-height:1.45;color:var(--navy);overflow-wrap:anywhere;}
  .rq-vroom{font-weight:800;}
  .rq-vmust{font-weight:700;}
  .rq-vsub{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .rq-vnote{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff7ed;border:1px solid #fde3c4;border-radius:8px;padding:6px 10px;}
  .rq-t{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;}
  .rq-t.main{font-weight:700;}
  .rq-t.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .rq-more{justify-self:start;background:none;border:0;padding:4px 0;min-height:36px;font-family:inherit;font-size:13px;font-weight:700;color:var(--navy2);cursor:pointer;}
  .rq-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .rq-chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fdecea;color:#9f2a1d;overflow-wrap:anywhere;max-width:100%;}
  .rq-thumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .rq-thumb{width:64px;height:64px;padding:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#cfdbe9,#e8eef5);cursor:zoom-in;flex:none;}
  .rq-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .rq-thumb.none img{display:none;}
  .pv-bg{position:fixed;inset:0;z-index:300;background:rgba(5,12,24,.92);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  .pv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;color:#fff;font-size:14px;}
  .pv-x{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:24px;line-height:1;min-width:44px;min-height:44px;border-radius:10px;cursor:pointer;margin-left:auto;}
  .pv-mid{display:flex;align-items:center;justify-content:center;gap:6px;min-height:0;padding:0 6px;}
  .pv-img{width:calc(100% - 100px);height:100%;min-width:0;object-fit:contain;display:block;}
  .pv-nav{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:28px;min-width:44px;min-height:64px;border-radius:10px;cursor:pointer;flex:none;}
  .pv-nav:disabled{opacity:.3;cursor:default;}
  .pv-cap{color:#fff;font-size:14px;text-align:center;padding:8px 16px 14px;overflow-wrap:anywhere;}
  .lt-box{display:grid;gap:2px;min-width:0;}
  .lt-btn{display:block;width:100%;min-height:48px;padding:8px 14px;border:1.5px solid #f59e0b;border-radius:12px;background:#fffbeb;color:#78350f;font-family:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer;line-height:1.45;overflow-wrap:anywhere;}
  .lt-btn:disabled{opacity:.6;cursor:default;}
  .lt-done{font-size:13px;font-weight:700;color:#78350f;overflow-wrap:anywhere;}
  .lt-tel{display:flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:var(--navy2);text-decoration:none;overflow-wrap:anywhere;}
  .lt-none{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .lt-bg{position:fixed;inset:0;z-index:250;background:rgba(10,25,45,.45);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .lt-sheet{background:#fff;border-radius:16px;padding:18px 18px 20px;width:100%;max-width:440px;display:grid;gap:10px;max-height:100%;overflow-y:auto;}
  .lt-sheet [hidden]{display:none !important;}
  .lt-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .lt-hd h3{font-size:17px;color:var(--navy);}
  .lt-x{background:none;border:0;font-size:24px;line-height:1;min-width:44px;min-height:44px;color:var(--muted);cursor:pointer;border-radius:10px;}
  .lt-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .lt-label{font-size:12px;font-weight:700;color:var(--muted);}
  .lt-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .lt-chip{min-height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px;}
  .lt-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .lt-f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted);}
  .lt-f input{width:100%;min-width:0;min-height:44px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);}
  .lt-err{color:var(--red);font-size:13px;font-weight:700;overflow-wrap:anywhere;}
  .lt-err:empty{display:none;}
  .lt-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .lt-cancel,.lt-send{min-height:44px;padding:8px 18px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .lt-cancel{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .lt-send{background:var(--navy);color:#fff;border:0;}
  .lt-cancel:disabled,.lt-send:disabled{opacity:.6;cursor:default;}
  @media(max-width:560px){ .lt-bg{align-items:flex-end;padding:0;} .lt-sheet{border-radius:16px 16px 0 0;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));} }
  .v-req{display:grid;gap:10px;}
  .v-req h3{font-size:15px;margin-bottom:4px;}
  .v-req-empty{font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  /* Task 30: 物件名と号室の帯（sticky・1行。上の切り欠きは body::before で塗る） */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#fff;z-index:60;pointer-events:none;}
  .cb-row{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;min-height:36px;
    padding:4px calc(16px + env(safe-area-inset-right,0px)) 4px calc(16px + env(safe-area-inset-left,0px));}
  .cb-place{flex:1 1 auto;min-width:0;font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Task 44: 線のアイコン（js/icons.js）。色は文字の色に合わせる */
  .ic{display:inline-block;flex:none;vertical-align:-0.18em;}
  .ic-lead{margin-right:.4em;}
  .rep-mic{display:inline-flex;align-items:center;justify-content:center;}
</style>
</head>
